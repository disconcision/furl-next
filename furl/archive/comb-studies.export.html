}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#furl-grid-studies {
 --paper:light-dark(#d9e5eb,#202f3a); --chrome:light-dark(#e9f0f3,#293b48);
 --ink:light-dark(#243944,#e1edf1); --quiet:light-dark(#607783,#a3b8c4);
 --line:light-dark(#becfd8,#405662); --binding:light-dark(#237898,#81cae4);
 --scope:light-dark(#796393,#bca7d9); --case:light-dark(#518b83,#82b8ad);
 --value:light-dark(#497139,#b0d299); --strip:light-dark(#bdd2df,#344858);
 --strip-edge:var(--paper); --selected:light-dark(#d0dece,#394b40);
 --block-edge:light-dark(#eff5f8,#647b8b); --echo:light-dark(#6d8796,#8da4b2);
 --return-bg:light-dark(#ded6e9,#443b53); --case-bg:light-dark(#c3dfdc,#304a4a);
 --pitch:1ch; --row:22px; --indent:1; --code-size:14px;
 width:100%; color:var(--ink); font:13px/1.5 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;
}
#furl-grid-studies * {box-sizing:border-box;}
#furl-grid-studies button,#furl-grid-studies select {font:inherit; color:inherit;}
#furl-grid-studies button {cursor:pointer;}
#furl-grid-studies button:focus-visible,#furl-grid-studies select:focus-visible {outline:2px solid var(--scope);outline-offset:2px;}
#furl-grid-studies .studies {display:flex;flex-wrap:wrap;gap:2px 19px;margin-bottom:12px;}
#furl-grid-studies .study {border:0;border-bottom:2px solid transparent;background:transparent;color:var(--quiet);padding:7px 0;}
#furl-grid-studies .study[aria-selected=&quot;true&quot;] {border-color:var(--scope);color:var(--ink);}
#furl-grid-studies .ordinal {font:11px/1.5 ui-monospace,monospace;color:var(--scope);margin-right:6px;}
#furl-grid-studies .editor {background:var(--paper);border:1px solid var(--line);border-radius:7px;}
#furl-grid-studies .bar {display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:9px 16px;}
#furl-grid-studies .titlebar {background:var(--chrome);border-radius:7px 7px 0 0;border-bottom:1px solid var(--line);}
#furl-grid-studies .logo {font-size:21px;font-weight:500;letter-spacing:-.6px;color:var(--scope);}
#furl-grid-studies .logo span {color:var(--binding);}
#furl-grid-studies .filename {color:var(--quiet);}
#furl-grid-studies .global-actions {display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;}
#furl-grid-studies .plain {background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;}
#furl-grid-studies .plain:hover {background:var(--chrome);}
#furl-grid-studies .legend {border-bottom:1px solid var(--line);gap:6px 17px;}
#furl-grid-studies .attribute {display:inline-flex;gap:6px;align-items:center;background:transparent;border:0;padding:3px 0;font-size:12px;color:var(--quiet);}
#furl-grid-studies .attribute[aria-pressed=&quot;true&quot;] {color:var(--ink);}
#furl-grid-studies .comb-visibility {justify-content:center;width:20px;min-height:25px;color:var(--scope)!important;padding:0;}
#furl-grid-studies .comb-symbol {font:23px/1 Georgia,&quot;Times New Roman&quot;,serif;}
#furl-grid-studies .comb-visibility[aria-pressed=&quot;false&quot;] .comb-symbol {opacity:.4;text-decoration:line-through;}
#furl-grid-studies .attribute[aria-pressed=&quot;false&quot;] .attribute-label {text-decoration:line-through;text-decoration-thickness:1px;}
#furl-grid-studies .swatch {height:7px;width:7px;border:1px solid currentColor;}
#furl-grid-studies .attribute[aria-pressed=&quot;true&quot;] .swatch {background:currentColor;}
#furl-grid-studies .attribute[data-attr=&quot;bindings&quot;] .swatch {color:var(--binding);}
#furl-grid-studies .attribute[data-attr=&quot;expressions&quot;] .swatch {color:var(--ink);}
#furl-grid-studies .attribute[data-attr=&quot;values&quot;] .swatch {color:var(--value);}
#furl-grid-studies .view-options {display:flex;gap:13px;flex-wrap:wrap;margin-left:auto;}
#furl-grid-studies .option {display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--quiet);white-space:nowrap;}
#furl-grid-studies input {accent-color:var(--scope);margin:0;}
#furl-grid-studies .context {gap:8px 14px;min-height:39px;font-size:12px;color:var(--quiet);}
#furl-grid-studies .context:empty {display:none;}
#furl-grid-studies .design-options {display:grid;grid-template-columns:1.25fr 1fr .85fr;align-items:start;border-bottom:1px solid var(--line);gap:10px 20px;}
#furl-grid-studies .option-group {display:flex;flex-wrap:wrap;gap:5px 12px;min-width:0;}
#furl-grid-studies .group-name {flex-basis:100%;font-size:11px;color:var(--quiet);}
#furl-grid-studies .option:has(input:disabled) {opacity:.45;}
#furl-grid-studies .design-options select {font-size:12px;background:var(--chrome);border:1px solid var(--line);border-radius:3px;}
#furl-grid-studies .context code {color:var(--ink);}
#furl-grid-studies .context select {background:var(--chrome);border:1px solid var(--line);border-radius:3px;padding:2px 5px;max-width:100%;font-size:12px;}
#furl-grid-studies .context .versions {display:flex;gap:4px;margin-left:auto;}
#furl-grid-studies .version {border:0;border-bottom:1px solid transparent;padding:2px 5px;background:transparent;color:var(--quiet);}
#furl-grid-studies .version[aria-pressed=&quot;true&quot;] {border-color:var(--scope);color:var(--ink);}
#furl-grid-studies code {font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,Menlo,monospace;font-size:12px;line-height:1.5;background:transparent;padding:0;}
#furl-grid-studies .program {
 position:relative;margin:0;padding:22px 2ch 22px 6ch;
 font:var(--code-size)/var(--row) &quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,Menlo,monospace;
 min-height:calc(2 * var(--row));
}
#furl-grid-studies .program[data-grid=&quot;true&quot;] {
 background-image:linear-gradient(to right,transparent calc(1ch - 1px),color-mix(in srgb,var(--line) 30%,transparent) calc(1ch - 1px)),linear-gradient(to bottom,transparent calc(var(--row) - 1px),color-mix(in srgb,var(--line) 35%,transparent) calc(var(--row) - 1px));
 background-size:1ch var(--row);background-position:6ch 22px;
}
#furl-grid-studies .scope,#furl-grid-studies .rows,#furl-grid-studies .parameters,#furl-grid-studies .branch-content {position:relative;min-width:0;margin:0;padding:0;}
#furl-grid-studies .scope.focus-scope {background:color-mix(in srgb,var(--scope) 7%,transparent);}
#furl-grid-studies .line {position:relative;min-height:var(--row);padding:0;margin:0;}
#furl-grid-studies .indent-strip {position:absolute;left:0;top:0;bottom:0;width:calc(var(--depth) * var(--indent) * 1ch);background:repeating-linear-gradient(to right,var(--strip) 0, var(--strip) calc(1ch - 1px),var(--strip-edge) calc(1ch - 1px),var(--strip-edge) 1ch);pointer-events:none;}
#furl-grid-studies .fields {position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:var(--row);align-items:start;}
#furl-grid-studies .fields &gt; .field {grid-row:1;}
#furl-grid-studies .field {min-width:0;margin:0;padding:0;line-height:var(--row);overflow-wrap:anywhere;white-space:pre-wrap;font:inherit;}
#furl-grid-studies .name {color:var(--binding);padding-left:calc(var(--depth) * var(--indent) * 1ch);}
#furl-grid-studies .echo {color:var(--echo)!important;}
#furl-grid-studies .echo &gt; span {background:transparent!important;color:var(--echo)!important;}
#furl-grid-studies .fn-value {font-style:italic;letter-spacing:-1px;}
#furl-grid-studies .trace-values {display:flex;flex-direction:column;}
#furl-grid-studies .expression {color:var(--ink);}
#furl-grid-studies .value {color:var(--value);}
#furl-grid-studies .field &gt; span {box-decoration-break:clone;-webkit-box-decoration-break:clone;}
#furl-grid-studies .return .name &gt; span {color:var(--scope);background:var(--return-bg);}
#furl-grid-studies .pattern .name &gt; span {background:var(--case-bg);}
#furl-grid-studies .dot {color:var(--scope);}
#furl-grid-studies .arity {opacity:.65;letter-spacing:0;}
#furl-grid-studies .kw {color:var(--scope);}
#furl-grid-studies .muted-code {color:var(--quiet);}
#furl-grid-studies .raw .fields {align-items:end;}
#furl-grid-studies .raw .expression {align-self:start;}
#furl-grid-studies .raw .field {font-weight:400;}
#furl-grid-studies .program[data-name-top=&quot;true&quot;] .raw .name,#furl-grid-studies .program[data-name-top=&quot;true&quot;] .raw .value {align-self:start;}
#furl-grid-studies .name-block {position:absolute;top:0;bottom:0;left:calc(var(--depth) * var(--indent) * 1ch);width:var(--name-block-width);background:var(--return-bg);pointer-events:none;}
#furl-grid-studies .raw.pattern-block .name &gt; span {background:transparent;}
#furl-grid-studies .outside-focus .field {color:var(--echo);}
#furl-grid-studies .outside-focus .name &gt; span {color:var(--echo);background:transparent;}
#furl-grid-studies .sample-link {display:inline;color:inherit;font:inherit;line-height:inherit;border:0;padding:0;margin:0;background:transparent;text-align:left;}
#furl-grid-studies .sample-link:hover {text-decoration:underline;text-underline-offset:3px;}
#furl-grid-studies .call-navigation {display:flex;align-items:center;flex-wrap:wrap;gap:5px 9px;}
#furl-grid-studies .call-navigation button {padding:1px 6px;}
#furl-grid-studies .plain:disabled {opacity:.4;cursor:default;}
#furl-grid-studies .run-context {flex-basis:100%;}
#furl-grid-studies .selected-lines {background:var(--selected);}
#furl-grid-studies .branches {position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:5ch;align-items:stretch;}
#furl-grid-studies .branches.stacked {grid-template-columns:minmax(0,1fr);row-gap:var(--row);}
#furl-grid-studies .branch {position:relative;display:flex;flex-direction:column;min-width:0;padding:0;margin:0;}
#furl-grid-studies .branch-fill {flex:1;min-height:0;position:relative;}
#furl-grid-studies .branch .tail {position:relative;}
#furl-grid-studies .branch .tail &gt; .line:last-child {align-self:end;}
#furl-grid-studies .comb-layer {position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible;}
#furl-grid-studies .comb-layer .scope-path {fill:none;stroke:var(--scope);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
#furl-grid-studies .comb-layer .case-path {fill:none;stroke:var(--case);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
#furl-grid-studies .comb-layer .block-path,#furl-grid-studies .comb-layer .divider-path {fill:none;stroke:var(--block-edge);stroke-width:1.5;stroke-linecap:square;}
#furl-grid-studies .rail {position:absolute;z-index:3;margin:0;padding:0;border:0;background:transparent;border-radius:0;color:var(--scope);font:12px/var(--row) ui-monospace,monospace;display:block;}
#furl-grid-studies .rail:hover {background:color-mix(in srgb,var(--scope) 15%,transparent);}
#furl-grid-studies .rail.case-rail {color:var(--case);}
#furl-grid-studies .rail:focus-visible {outline:1px solid var(--scope);outline-offset:2px;}
#furl-grid-studies .rail .plus {position:absolute;top:0;left:0;right:0;font-size:14px;line-height:var(--row);text-align:center;background:var(--paper);}
#furl-grid-studies .review-foot {display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:11px;color:var(--quiet);min-height:18px;}
#furl-grid-studies .review-foot .interaction {color:var(--ink);}
#furl-grid-studies .review-foot .fixture {margin-left:auto;}
#furl-grid-studies .sr {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
#furl-grid-studies [hidden] {display:none!important;}
@media(max-width:600px) {
 #furl-grid-studies {--code-size:13px;}
 #furl-grid-studies .bar {padding-left:12px;padding-right:12px;}
 #furl-grid-studies .studies {column-gap:14px;}
 #furl-grid-studies .view-options {margin-left:0;}
 #furl-grid-studies .design-options {grid-template-columns:minmax(0,1fr);gap:11px;}
 #furl-grid-studies .program {padding-left:5ch;padding-right:1ch;}
 #furl-grid-studies .review-foot .fixture {margin-left:0;}
}
@media(pointer:coarse) {
 #furl-grid-studies .study,#furl-grid-studies .plain,#furl-grid-studies .attribute {min-height:38px;}
}

(() =&gt; {
