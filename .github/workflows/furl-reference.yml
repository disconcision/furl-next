name: Furl reference
on:
  push:
    branches: [furl]
    paths: ['furl/reference/**', 'furl/interactions/**', 'docs/index.html', 'docs/studies.html', 'docs/interactions.html', '.github/workflows/furl-reference.yml', 'src/web/www/img/hazelnut.svg']
  pull_request:
    paths: ['furl/reference/**', 'furl/interactions/**', 'docs/index.html', 'docs/studies.html', 'docs/interactions.html', '.github/workflows/furl-reference.yml', 'src/web/www/img/hazelnut.svg']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 furl/reference/build.py --check
      - run: python3 furl/interactions/build.py --check
      - run: node --check furl/reference/fixtures.js
      - run: node --check furl/reference/study.js
      - run: node --check furl/interactions/stories.js
      - run: node --check furl/interactions/study.js
