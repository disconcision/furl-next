<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Furl — study switcher</title><style>:root {color-scheme:light dark;--page:light-dark(#f5f8fa,#182630);--text:light-dark(#243944,#e1edf1);--muted-text:light-dark(#566f7c,#a3b8c4);--rule:light-dark(#cbd8df,#405662);--purple:light-dark(#796393,#bca7d9);--blue:light-dark(#237898,#81cae4);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6;color:var(--text);background:var(--page);}
* {box-sizing:border-box;}
body {margin:0;font-size:15px;}
a {color:inherit;text-underline-offset:4px;text-decoration-color:var(--rule);}
a:hover {text-decoration-color:var(--purple);}
a:focus-visible,summary:focus-visible {outline:2px solid var(--purple);outline-offset:4px;}
.book {max-width:1120px;margin:0 auto;padding:0 28px;}
.masthead {display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:23px 0;border-bottom:1px solid var(--rule);}
.wordmark {font-size:34px;line-height:1;letter-spacing:-1px;font-weight:500;color:var(--purple);text-decoration:none;}
.wordmark span {color:var(--blue);}
.masthead nav {display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted-text);}
.introduction {max-width:690px;margin:50px 0 28px;}
.eyebrow {color:var(--muted-text);font-size:12px;}
h1 {font-size:clamp(26px,4.1vw,36px);font-weight:500;line-height:1.25;letter-spacing:-.6px;margin:14px 0 21px;}
p {margin:12px 0;}
.note,.try {color:var(--muted-text);font-size:13px;}
.note {max-width:650px;margin-top:20px;}
.contents {display:flex;flex-wrap:wrap;gap:8px 20px;padding:19px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted-text);}
.contents a {text-decoration:none;}
.chapter {margin-top:54px;scroll-margin-top:24px;}
.chapter-copy {max-width:700px;margin-bottom:23px;}
h2 {font-size:22px;font-weight:500;line-height:1.35;letter-spacing:-.25px;margin:0 0 16px;}
h2 > span {font:12px/1.5 ui-monospace,monospace;color:var(--purple);display:inline-block;width:29px;vertical-align:middle;letter-spacing:0;}
code {font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.92em;}
.integral {font:19px/1 Georgia,serif;color:var(--purple);}
.direction {max-width:700px;margin:64px 0 44px;padding-top:27px;border-top:1px solid var(--rule);}
footer {border-top:1px solid var(--rule);padding:24px 0 35px;font-size:12px;color:var(--muted-text);}
.footer-line {display:flex;flex-wrap:wrap;gap:15px;justify-content:space-between;align-items:center;}
.powered {display:flex;align-items:center;gap:6px;text-decoration:none;}
.powered img {filter:none;}
.credits {margin-top:18px;max-width:700px;}
.credits summary {cursor:pointer;}
.skip {position:absolute;left:20px;top:-70px;padding:8px;background:var(--page);z-index:10;}
.skip:focus {top:8px;}
@media(prefers-color-scheme:dark) {.powered img {filter:brightness(1.85);}}
@media(max-width:600px) {.book {padding:0 12px;}.masthead {padding:20px 0;gap:18px;}.masthead nav {gap:13px;font-size:12px;}.introduction {margin-top:32px;}.chapter {margin-top:40px;}.chapter-copy {padding:0 4px;}h2 {font-size:20px;}.contents {gap:8px 17px;}}
@media print {.book {max-width:none;padding:0;}.masthead nav,.contents,.try,.furl-study .bar,.furl-study .review-foot,.credits {display:none;}.chapter {break-inside:avoid;}.introduction {margin-top:20px;}a {text-decoration:none;}}

.furl-study {
 --paper:light-dark(#d9e5eb,#202f3a); --chrome:light-dark(#e9f0f3,#293b48);
 --ink:light-dark(#243944,#e1edf1); --quiet:light-dark(#607783,#a3b8c4);
 --line:light-dark(#becfd8,#405662); --binding:light-dark(#237898,#81cae4);
 --scope:light-dark(#796393,#bca7d9); --case:light-dark(#518b83,#82b8ad);
 --value:light-dark(#497139,#b0d299); --strip:light-dark(#bdd2df,#344858);
 --strip-edge:var(--paper); --selected:light-dark(#d0dece,#394b40);
 --block-edge:light-dark(#eff5f8,#647b8b); --echo:light-dark(#6d8796,#8da4b2);
 --return-bg:light-dark(#ded6e9,#443b53); --case-bg:light-dark(#c3dfdc,#304a4a);
 --pitch:1ch; --row:22px; --indent:1; --code-size:14px;
 width:100%; color:var(--ink); font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.furl-study * {box-sizing:border-box;}
.furl-study button,.furl-study select {font:inherit; color:inherit;}
.furl-study button {cursor:pointer;}
.furl-study button:focus-visible,.furl-study select:focus-visible {outline:2px solid var(--scope);outline-offset:2px;}
.furl-study .studies {display:flex;flex-wrap:wrap;gap:2px 19px;margin-bottom:12px;}
.furl-study .study {border:0;border-bottom:2px solid transparent;background:transparent;color:var(--quiet);padding:7px 0;}
.furl-study .study[aria-selected="true"] {border-color:var(--scope);color:var(--ink);}
.furl-study .ordinal {font:11px/1.5 ui-monospace,monospace;color:var(--scope);margin-right:6px;}
.furl-study .editor {background:var(--paper);border:1px solid var(--line);border-radius:7px;}
.furl-study .bar {display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:9px 16px;}
.furl-study .titlebar {background:var(--chrome);border-radius:7px 7px 0 0;border-bottom:1px solid var(--line);}
.furl-study .logo {font-size:21px;font-weight:500;letter-spacing:-.6px;color:var(--scope);}
.furl-study .logo span {color:var(--binding);}
.furl-study .filename {color:var(--quiet);}
.furl-study .global-actions {display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;}
.furl-study .plain {background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;}
.furl-study .plain:hover {background:var(--chrome);}
.furl-study .legend {border-bottom:1px solid var(--line);gap:6px 17px;}
.furl-study .attribute {display:inline-flex;gap:6px;align-items:center;background:transparent;border:0;padding:3px 0;font-size:12px;color:var(--quiet);}
.furl-study .attribute[aria-pressed="true"] {color:var(--ink);}
.furl-study .comb-visibility {justify-content:center;width:20px;min-height:25px;color:var(--scope)!important;padding:0;}
.furl-study .comb-symbol {font:23px/1 Georgia,"Times New Roman",serif;}
.furl-study .comb-visibility[aria-pressed="false"] .comb-symbol {opacity:.4;text-decoration:line-through;}
.furl-study .attribute[aria-pressed="false"] .attribute-label {text-decoration:line-through;text-decoration-thickness:1px;}
.furl-study .swatch {height:7px;width:7px;border:1px solid currentColor;}
.furl-study .attribute[aria-pressed="true"] .swatch {background:currentColor;}
.furl-study .attribute[data-attr="bindings"] .swatch {color:var(--binding);}
.furl-study .attribute[data-attr="expressions"] .swatch {color:var(--ink);}
.furl-study .attribute[data-attr="values"] .swatch {color:var(--value);}
.furl-study .view-options {display:flex;gap:13px;flex-wrap:wrap;margin-left:auto;}
.furl-study .option {display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--quiet);white-space:nowrap;}
.furl-study input {accent-color:var(--scope);margin:0;}
.furl-study .context {gap:8px 14px;min-height:39px;font-size:12px;color:var(--quiet);}
.furl-study .context:empty {display:none;}
.furl-study .design-options {display:grid;grid-template-columns:1.25fr 1fr .85fr;align-items:start;border-bottom:1px solid var(--line);gap:10px 20px;}
.furl-study .option-group {display:flex;flex-wrap:wrap;gap:5px 12px;min-width:0;}
.furl-study .group-name {flex-basis:100%;font-size:11px;color:var(--quiet);}
.furl-study .option:has(input:disabled) {opacity:.45;}
.furl-study .design-options select {font-size:12px;background:var(--chrome);border:1px solid var(--line);border-radius:3px;}
.furl-study .context code {color:var(--ink);}
.furl-study .context select {background:var(--chrome);border:1px solid var(--line);border-radius:3px;padding:2px 5px;max-width:100%;font-size:12px;}
.furl-study .context .versions {display:flex;gap:4px;margin-left:auto;}
.furl-study .version {border:0;border-bottom:1px solid transparent;padding:2px 5px;background:transparent;color:var(--quiet);}
.furl-study .version[aria-pressed="true"] {border-color:var(--scope);color:var(--ink);}
.furl-study code {font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:12px;line-height:1.5;background:transparent;padding:0;}
.furl-study .program {
 position:relative;margin:0;padding:22px 2ch 22px 6ch;
 font:var(--code-size)/var(--row) "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
 min-height:calc(2 * var(--row));
}
.furl-study .program[data-grid="true"] {
 background-image:linear-gradient(to right,transparent calc(1ch - 1px),color-mix(in srgb,var(--line) 30%,transparent) calc(1ch - 1px)),linear-gradient(to bottom,transparent calc(var(--row) - 1px),color-mix(in srgb,var(--line) 35%,transparent) calc(var(--row) - 1px));
 background-size:1ch var(--row);background-position:6ch 22px;
}
.furl-study .scope,.furl-study .rows,.furl-study .parameters,.furl-study .branch-content {position:relative;min-width:0;margin:0;padding:0;}
.furl-study .scope.focus-scope {background:color-mix(in srgb,var(--scope) 7%,transparent);}
.furl-study .line {position:relative;min-height:var(--row);padding:0;margin:0;}
.furl-study .indent-strip {position:absolute;left:0;top:0;bottom:0;width:calc(var(--depth) * var(--indent) * 1ch);background:repeating-linear-gradient(to right,var(--strip) 0, var(--strip) calc(1ch - 1px),var(--strip-edge) calc(1ch - 1px),var(--strip-edge) 1ch);pointer-events:none;}
.furl-study .fields {position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:var(--row);align-items:start;}
.furl-study .fields > .field {grid-row:1;}
.furl-study .field {min-width:0;margin:0;padding:0;line-height:var(--row);overflow-wrap:anywhere;white-space:pre-wrap;font:inherit;}
.furl-study .name {color:var(--binding);padding-left:calc(var(--depth) * var(--indent) * 1ch);}
.furl-study .echo {color:var(--echo)!important;}
.furl-study .echo > span {background:transparent!important;color:var(--echo)!important;}
.furl-study .fn-value {font-style:italic;letter-spacing:-1px;}
.furl-study .trace-values {display:flex;flex-direction:column;}
.furl-study .expression {color:var(--ink);}
.furl-study .value {color:var(--value);}
.furl-study .field > span {box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.furl-study .return .name > span {color:var(--scope);background:var(--return-bg);}
.furl-study .pattern .name > span {background:var(--case-bg);}
.furl-study .dot {color:var(--scope);}
.furl-study .arity {opacity:.65;letter-spacing:0;}
.furl-study .kw {color:var(--scope);}
.furl-study .muted-code {color:var(--quiet);}
.furl-study .raw .fields {align-items:end;}
.furl-study .raw .expression {align-self:start;}
.furl-study .raw .field {font-weight:400;}
.furl-study .program[data-name-top="true"] .raw .name,.furl-study .program[data-name-top="true"] .raw .value {align-self:start;}
.furl-study .name-block {position:absolute;top:0;bottom:0;left:calc(var(--depth) * var(--indent) * 1ch);width:var(--name-block-width);background:var(--return-bg);pointer-events:none;}
.furl-study .raw.pattern-block .name > span {background:transparent;}
.furl-study .outside-focus .field {color:var(--echo);}
.furl-study .outside-focus .name > span {color:var(--echo);background:transparent;}
.furl-study .sample-link {display:inline;color:inherit;font:inherit;line-height:inherit;border:0;padding:0;margin:0;background:transparent;text-align:left;}
.furl-study .sample-link:hover {text-decoration:underline;text-underline-offset:3px;}
.furl-study .call-navigation {display:flex;align-items:center;flex-wrap:wrap;gap:5px 9px;}
.furl-study .call-navigation button {padding:1px 6px;}
.furl-study .plain:disabled {opacity:.4;cursor:default;}
.furl-study .run-context {flex-basis:100%;}
.furl-study .selected-lines {background:var(--selected);}
.furl-study .branches {position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:5ch;align-items:stretch;}
.furl-study .branches.stacked {grid-template-columns:minmax(0,1fr);row-gap:var(--row);}
.furl-study .branch {position:relative;display:flex;flex-direction:column;min-width:0;padding:0;margin:0;}
.furl-study .branch-fill {flex:1;min-height:0;position:relative;}
.furl-study .branch .tail {position:relative;}
.furl-study .branch .tail > .line:last-child {align-self:end;}
.furl-study .comb-layer {position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible;}
.furl-study .comb-layer .scope-path {fill:none;stroke:var(--scope);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.furl-study .comb-layer .case-path {fill:none;stroke:var(--case);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.furl-study .comb-layer .block-path,.furl-study .comb-layer .divider-path {fill:none;stroke:var(--block-edge);stroke-width:1.5;stroke-linecap:square;}
.furl-study .rail {position:absolute;z-index:3;margin:0;padding:0;border:0;background:transparent;border-radius:0;color:var(--scope);font:12px/var(--row) ui-monospace,monospace;display:block;}
.furl-study .rail:hover {background:color-mix(in srgb,var(--scope) 15%,transparent);}
.furl-study .rail.case-rail {color:var(--case);}
.furl-study .rail:focus-visible {outline:1px solid var(--scope);outline-offset:2px;}
.furl-study .rail .plus {position:absolute;top:0;left:0;right:0;font-size:14px;line-height:var(--row);text-align:center;background:var(--paper);}
.furl-study .review-foot {display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:11px;color:var(--quiet);min-height:18px;}
.furl-study .review-foot .interaction {color:var(--ink);}
.furl-study .review-foot .fixture {margin-left:auto;}
.furl-study .sr {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.furl-study [hidden] {display:none!important;}
@media(max-width:600px) {
 .furl-study {--code-size:13px;}
 .furl-study .bar {padding-left:12px;padding-right:12px;}
 .furl-study .studies {column-gap:14px;}
 .furl-study .view-options {margin-left:0;}
 .furl-study .design-options {grid-template-columns:minmax(0,1fr);gap:11px;}
 .furl-study .program {padding-left:5ch;padding-right:1ch;}
 .furl-study .review-foot .fixture {margin-left:0;}
}
@media(pointer:coarse) {
 .furl-study .study,.furl-study .plain,.furl-study .attribute {min-height:38px;}
}

.furl-study .display-settings {border-bottom:1px solid var(--line);}
.furl-study .display-settings summary {padding:7px 16px;color:var(--quiet);cursor:pointer;font-size:12px;}
.furl-study .display-settings[open] summary {padding-bottom:0;}
.furl-study .display-settings .design-options {border-bottom:0;}
.furl-study .editor {border-radius:4px;}
.furl-study .titlebar {border-radius:4px 4px 0 0;}
.furl-study .option {white-space:normal;}
@media (pointer:coarse) {
 .furl-study .option,.furl-study .attribute,.furl-study .plain,.furl-study .version,.furl-study .study {min-height:44px;}
}

</main></div><script>/* Preset programs and samples; these are not a language evaluator. */
function createFurlFixtures() {
 const A=(text,v='',id='')=>({kind:'atom',text,v,id});
 const D=(name,exp)=>({name,exp});
 const S=(id,kind,defs,out,params=[],v='')=>({id,kind,defs,out,params,v});
 const M=(id,scrut,branches,v='')=>({id,kind:'match',scrut,branches,v});
 const P=(name,v)=>({name,v});
 const B=(pat,defs,out,active,matched='')=>({pat,defs,out,active,matched});
 const callFrames=[
  {id:'c0',parent:null,child:'c1',args:'[2,4,6]',value:'12'},
  {id:'c1',parent:'c0',child:'c2',args:'[4,6]',value:'10'},
  {id:'c2',parent:'c1',child:'c3',args:'[6]',value:'6'},
  {id:'c3',parent:'c2',child:null,args:'[]',value:'0'}
 ];
 const callById=new Map(callFrames.map(c=>[c.id,c]));
 const sumV=Object.fromEntries(callFrames.map(c=>[c.id,c.value]));
 function squared(id,dx='dx',dy='dy') {
  return S(id,'let',[D(dx,A('x2 - x1','3')),D(dy,A('y2 - y1','4')),D('sx',A(dx+' * '+dx,'9')),D('sy',A(dy+' * '+dy,'16'))],A('sx + sy','25'));

      const joinedMatch=childMatch&&Math.abs(childMatch.getBoundingClientRect().top-pr.top-py)<.1;
      const markEnd=x+pitch*(joinedMatch&&!state.sharedStem?1:.75);
      path('M '+x+' '+py+' H '+markEnd,'fun','parameter');
      if(state.extendParameter&&!joinedMatch){const field=params.querySelector('.expression')||params.querySelector('.name');if(field)path('M '+(x+pitch)+' '+py+' H '+(field.getBoundingClientRect().right-pr.left),'divider');}
     }
    }
   }
   const b=document.createElement('button');b.type='button';b.className='rail'+(frame.n.kind==='match'?' case-rail':'');b.dataset.target=frame.n.id;
   b.style.left=buttonX+'px';b.style.top=buttonY+'px';b.style.width=buttonWidth+'px';b.style.height=buttonHeight+'px';
   const kind=frame.n.kind==='fun'?'function':frame.n.kind==='match'?'match':'let block';
   const label=(frame.expanded?'Unfurl ':'Furl ')+kind+' '+frame.name;
   b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(frame.expanded));
   b.setAttribute('data-tooltip',label);
   if(!frame.expanded)b.innerHTML='<span class="plus" aria-hidden="true">+</span>';
   b.addEventListener('mouseenter',()=>{el.classList.add('focus-scope');root.querySelector('[data-ui="interaction"]').textContent=label;});
   b.addEventListener('mouseleave',()=>{el.classList.remove('focus-scope');root.querySelector('[data-ui="interaction"]').textContent=interactionHint();});
   b.addEventListener('click',()=>{state.open[frame.n.id]=!state.open[frame.n.id];renderProgram(frame.n.id);root.querySelector('[data-ui="announcement"]').textContent=label;});
   program.appendChild(b);
  }
  program.appendChild(svg);
 }
 function interactionHint(){return state.comb?'Click a comb or match bridge to unfurl; click + to furl.':'Comb hidden · use Furl all or Unfurl all to change the view.';}
 function renderProgram(focusId=''){
  root.style.setProperty('--indent',state.indentation?1:0);root.style.setProperty('--row',state.rowHeight+'px');program.dataset.grid=String(state.grid);program.dataset.nameTop=String(state.nameAtTop);
  getDimensions();frames.length=0;
  const c=current();layout=makeLayout(c.node);program.dataset.laneCount=String(layout.logicalLanes);program.dataset.stacked=String(layout.stacked);program.innerHTML='<div class="content-grid" style="width:'+layout.total+'ch">'+renderNode(c.node,c.name,0,layout.placements.get(c.node))+'</div>';
  root.querySelectorAll('[data-attr]').forEach(b=>b.setAttribute('aria-pressed',String(state[b.dataset.attr])));
  root.querySelector('[data-ui="indent"]').checked=state.indentation;root.querySelector('[data-ui="params"]').checked=state.parameterMark;root.querySelector('[data-ui="grid"]').checked=state.grid;
  root.querySelector('[data-ui="block"]').checked=state.blockEdge;root.querySelector('[data-ui="pattern-block"]').checked=state.patternBlock;root.querySelector('[data-ui="name-top"]').checked=state.nameAtTop;root.querySelector('[data-ui="extend"]').checked=state.extendParameter;root.querySelector('[data-ui="shared"]').checked=state.sharedStem;
  root.querySelector('[data-ui="params"]').disabled=!state.comb;root.querySelector('[data-ui="extend"]').disabled=!state.comb||!state.parameterMark;root.querySelector('[data-ui="shared"]').disabled=!state.comb;
  root.querySelector('[data-ui="interaction"]').textContent=interactionHint();
  queueDraw();
  if(focusId)requestAnimationFrame(()=>{const b=program.querySelector('[data-target="'+focusId+'"]');if(b)b.focus({preventScroll:true});});
 }
 function renderContext(){
  const mount=root.querySelector('[data-ui="context"]');
  if(state.study==='lets')mount.innerHTML='';
  if(state.study==='functions')mount.innerHTML='<span>Trace</span><code>scale 3 → apply 4</code>';
  if(state.study==='matches')mount.innerHTML='<label for="'+root.id+'-sample">input</label><select id="'+root.id+'-sample" data-ui="sample"><option value="some">Some 7</option><option value="none">None</option></select>';
  if(state.study==='combined')mount.innerHTML='<label for="'+root.id+'-sample">Trace</label><select id="'+root.id+'-sample" data-ui="sample"><option value="some">format "px" (Some 7)</option><option value="none">format "px" None</option></select>';
  if(state.study==='recursion'){
   const call=callById.get(sample()),i=callFrames.indexOf(call);
   mount.innerHTML='<span class="run-context">Run <code>sum [2,4,6] → 12</code></span><div class="call-navigation" aria-label="Navigate call samples"><span>Focused call</span><button class="plain" type="button" data-call="'+(callFrames[i-1]?.id||'')+'" aria-label="Previous call sample"'+(i===0?' disabled':'')+'>◀</button><span class="call-count">'+(i+1)+' / '+callFrames.length+'</span><button class="plain" type="button" data-call="'+(callFrames[i+1]?.id||'')+'" aria-label="Next call sample"'+(i===callFrames.length-1?' disabled':'')+'>▶</button><code>sum '+call.args+' → '+call.value+'</code>'+(call.parent?'<span>from <code>sum '+callById.get(call.parent).args+'</code></span>':'')+'</div>';
  }
  if(state.study==='traces')mount.innerHTML='<span>Two calls</span><code>format "px" (Some 7)</code><code>format "px" None</code>';
  if(state.study==='helper')mount.innerHTML='<span>Trace</span><code>through (0,0) (3,4)</code><div class="versions" aria-label="Refactoring state"><button class="version" data-version="before" aria-pressed="'+(state.helperVersion==='before')+'" type="button">Before</button><button class="version" data-version="after" aria-pressed="'+(state.helperVersion==='after')+'" type="button">After extraction</button></div>';
  const picker=mount.querySelector('[data-ui="sample"]');if(picker){picker.value=sample();picker.addEventListener('change',()=>{state.samples[state.study]=picker.value;renderProgram();});}
  mount.querySelectorAll('[data-call]').forEach(b=>b.addEventListener('click',()=>selectCall(b.dataset.call)));
  mount.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{state.helperVersion=b.dataset.version;renderContext();renderProgram();}));
 }
 function selectCall(id){if(!callById.has(id))return;state.samples.recursion=id;renderContext();renderProgram();const c=callById.get(id);root.querySelector('[data-ui="announcement"]').textContent='Focused call sum '+c.args+', result '+c.value;}
 function chooseStudy(id){state.study=id;root.querySelectorAll('[data-study]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.study===id)));if(root.querySelector('.studies'))root.querySelector('[data-ui="study-panel"]').setAttribute('aria-labelledby',root.id+'-tab-'+id);root.querySelector('[data-ui="filename"]').textContent=current().file;renderContext();renderProgram();}
 root.querySelectorAll('[data-study]').forEach(b=>b.addEventListener('click',()=>chooseStudy(b.dataset.study)));
 root.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>{visit(current().node,n=>{state.open[n.id]=b.dataset.all==='true';});renderProgram();root.querySelector('[data-ui="announcement"]').textContent=b.dataset.all==='true'?'All scopes furled':'All scopes unfurled to code';}));
 root.querySelectorAll('[data-attr]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.attr]=!state[b.dataset.attr];renderProgram();}));
 root.querySelector('[data-ui="indent"]').addEventListener('change',e=>{state.indentation=e.target.checked;renderProgram();});
 root.querySelector('[data-ui="params"]').addEventListener('change',e=>{state.parameterMark=e.target.checked;renderProgram();});
 root.querySelector('[data-ui="grid"]').addEventListener('change',e=>{state.grid=e.target.checked;renderProgram();});
 for(const [id,key] of [['fg-block','blockEdge'],['fg-pattern-block','patternBlock'],['fg-name-top','nameAtTop'],['fg-extend','extendParameter'],['fg-shared','sharedStem']])root.querySelector('[data-ui="'+id.replace('fg-','')+'"]').addEventListener('change',e=>{state[key]=e.target.checked;renderProgram();});
 program.addEventListener('click',e=>{const b=e.target.closest('[data-call]');if(b)selectCall(b.dataset.call);});
 root.querySelector('[data-ui="context"]').addEventListener('keydown',e=>{if(state.study!=='recursion'||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=callFrames.findIndex(c=>c.id===sample());const next=callFrames[i+(e.key==='ArrowRight'?1:-1)];if(next){selectCall(next.id);root.querySelector('.call-navigation button:not(:disabled)')?.focus();}});
 let lastWidth=0;
 const resize=new ResizeObserver(()=>{const width=Math.round(program.getBoundingClientRect().width);if(width!==lastWidth){lastWidth=width;renderProgram();}});resize.observe(program);
 chooseStudy(initialStudy);
}

document.querySelectorAll('.furl-study').forEach(root => mountFurlStudy(root, root.dataset.initialStudy));
const labelTooltips=()=>document.querySelectorAll('[data-tooltip]').forEach(el=>el.title=el.dataset.tooltip);
labelTooltips();
new MutationObserver(labelTooltips).observe(document.querySelector('main'),{childList:true,subtree:true});
</script></body></html>
